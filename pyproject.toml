[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "controle-qualite-finess"
version = "1.0.0"
description = "Contrôle qualité du référentiel national FINESS des établissements sanitaires et sociaux"
requires-python = ">=3.10"
dependencies = ["duckdb>=1.1", "pyarrow>=14", "pyproj>=3.6", "shapely>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
finess-qc = "finess_qc.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
